# Builds the "portable" release asset (SDL3 included, glibc 2.36+) and
# attaches it to the release. install.sh uses it on systems without SDL3
# packages (Ubuntu 24.04, Debian 12, Mint 22, Bazzite ...).
name: portable build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to attach the asset to
        required: true

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Tools for checkout and upload
        run: apt-get update -qq && apt-get install -y -qq git curl ca-certificates gh >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: SRC="$GITHUB_WORKSPACE" packaging/build-portable.sh
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" dist/gamepad-osk-portable-x86_64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
